[package]
name = "nasa_tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
atomicwrites = "0.4"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
eframe = "0.31"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
